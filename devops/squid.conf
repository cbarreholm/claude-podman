# Squid proxy configuration for claude-podman restricted network
# Only allows HTTPS CONNECT to Anthropic API endpoints

# Listen on port 3128
http_port 3128

# ACL: Allowed domains for Claude Code
acl allowed_domains dstdomain .anthropic.com
acl allowed_domains dstdomain .claude.ai
acl allowed_domains dstdomain .sentry.io
acl allowed_domains dstdomain .statsig.anthropic.com

# ACL: Only allow CONNECT method (HTTPS tunneling)
acl CONNECT method CONNECT

# Allow CONNECT to allowed domains on port 443
http_access allow CONNECT allowed_domains

# Deny everything else
http_access deny all

# Minimal logging to stdout for container use
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr

# No caching needed
cache deny all
